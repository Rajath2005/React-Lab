name: Export Templates

on:
  push:
    branches:
      - main
    paths:
      - 'exp*/**'
      - 'scripts/export-labs.js'
      - 'showcase/src/data/experiments.json'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Export Script
        run: node scripts/export-labs.js

      - name: Publish to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest React Lab Templates"
          files: |
            templates/*.zip
            templates/registry.json
          token: ${{ secrets.GITHUB_TOKEN }}
