/* ProfileCard.css */
.profile-image {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
    transition: transform 0.3s ease;
}

.profile-image:hover {
    transform: scale(1.1);
}

.profile-card {
    max-width: 300px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
    background-color: #225f83;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(143, 26, 26, 0.1);
    transition: transform 0.3s ease;
}

.profile-card:hover {
    transform: translateY(-5px);
}

h2 {
    font-size: 1.5em;
    margin: 10px 0;
    font-family: 'Arial', sans-serif;
}

p {
    font-size: 1em;
    color: #555;
    font-family: 'Arial', sans-serif;
    margin-top: 10px;
}

</head>

    <script type="text/babel">

            try {
                console.log('Checking React availability...');
                console.log('window.React:', typeof window.React);
                console.log('window.ReactDOM:', typeof window.ReactDOM);
                
                if (!window.React) {
                    throw new Error('React not loaded');
                }
                if (!window.ReactDOM) {
                    throw new Error('ReactDOM not loaded');
                }
                if (!window.React.createElement) {
                    throw new Error('React.createElement not available');

                const React = window.React;
                const ReactDOM = window.ReactDOM;
                const { useState, useEffect, useReducer, useContext, useRef, useCallback, useMemo, Component } = React;
                
                console.log('✓ React loaded successfully');
                console.log('Defining components...');
                
                
// ProfileCard Component


const ProfileCard = ({ name, bio, profilePicture, backgroundColor }) => {

    const [isHovered, setIsHovered] = useState(false);

    return (
        <div
            style={{
                backgroundColor: isHovered ? "#e0e0e0" : backgroundColor,
                textAlign: "center",
                padding: "20px",
                borderRadius: "10px",
                width: "250px",
                margin: "auto",
                boxShadow: "0 4px 6px rgba(0,0,0,0.1)",
            }}
            onMouseEnter={() => setIsHovered(true)}
            onMouseLeave={() => setIsHovered(false)}
        >

            <img
                src={profilePicture}
                alt="Profile"
                style={{
                    width: "120px",
                    height: "120px",
                    borderRadius: "50%"
                }}
            />

            <h2>{name}</h2>
            <p>{bio}</p>

        </div>
    );
};



                

function App() {
  return (
    <div>
      <h1 style={{ textAlign: "center" }}>User Profile</h1>

      <ProfileCard
        name="John Doe"
        bio="A passionate developer with a love for learning and coding."
        profilePicture="https://img.freepik.com/free-photo/closeup-shot-beautiful-butterfly-with-interesting-textures-orange-petaled-flower_181624-7640.jpg?semt=ais_hybrid&w=740&q=80"
        backgroundColor="pink"
      />
    </div>
  );
}


                
                console.log('✓ Components defined');
                console.log('Rendering to DOM...');
                
                const rootElement = document.getElementById('root');
                if (!rootElement) {
                    throw new Error('Root element not found');
                }
                
                try {
                    // Try React 18 API first
                    const root = ReactDOM.createRoot(rootElement);
                    root.render(React.createElement(App));
                } catch (e) {
                    // Fallback to React 16/17 API
                    console.log('Using legacy render method...');
                    ReactDOM.render(React.createElement(App), rootElement);
                }
                
                console.log('✓ App rendered successfully');
            } catch (error) {
                console.error('DEMO ERROR:', error);
                const root = document.getElementById('root');
                if (root) {
                    root.innerHTML = '<div style="color: red; padding: 30px; font-family: monospace; font-size: 14px; line-height: 1.5;"><h2>Error:</h2><pre>' + (error.stack || error.message) + '</pre></div>';
                }
            }
        }, 500); // Give React 500ms to load
    </script>
