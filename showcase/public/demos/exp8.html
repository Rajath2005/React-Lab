<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Reminder with Filtering - Live Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #333;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #root {
            width: 100%;
            max-width: 100%;
        }
        
        body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
  padding: 20px;
}

div {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

input, textarea, select, button {
  width: 100%;
  margin: 10px 0;
  padding: 8px;
}

button {
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: #eee;
  margin: 5px 0;
  padding: 10px;
  border-radius: 5px;
}
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    
    <script type="text/babel">
        console.log('%c=== Task Reminder with Filtering Demo Starting ===', 'color: green; font-size: 14px; font-weight: bold');
        
        // Simple synchronous React initialization
        setTimeout(() => {
            try {
                console.log('Checking React availability...');
                console.log('window.React:', typeof window.React);
                console.log('window.ReactDOM:', typeof window.ReactDOM);
                
                if (!window.React) {
                    throw new Error('React not loaded');
                }
                if (!window.ReactDOM) {
                    throw new Error('ReactDOM not loaded');
                }
                if (!window.React.createElement) {
                    throw new Error('React.createElement not available');
                }
                
                const React = window.React;
                const ReactDOM = window.ReactDOM;
                const { useState, useEffect, useReducer, useContext, useRef, useCallback, useMemo, Component } = React;
                
                console.log('✓ React loaded successfully');
                console.log('Defining components...');
                
                
// Reminder Component


const Reminder = () => {
  const [tasks, setTasks] = useState([]);
  const [task, setTask] = useState({ name: "", due: "", desc: "" });
  const [filter, setFilter] = useState("all");

  // Add Task
  const addTask = () => {
    if (!task.name || !task.due) return;

    setTasks([
      ...tasks,
      { ...task, id: Date.now(), completed: false }
    ]);

    setTask({ name: "", due: "", desc: "" });
  };

  // Toggle Complete
  const toggleCompletion = (id) => {
    setTasks(
      tasks.map(t =>
        t.id === id ? { ...t, completed: !t.completed } : t
      )
    );
  };

  // Filter
  const filteredTasks = tasks.filter(t => {
    if (filter === "completed") return t.completed;
    if (filter === "pending") return !t.completed;
    return true;
  });

  return (
    <div>
      <h2>Add Task</h2>

      <input
        placeholder="Task Name"
        value={task.name}
        onChange={e => setTask({ ...task, name: e.target.value })}
      />

      <input
        type="date"
        value={task.due}
        onChange={e => setTask({ ...task, due: e.target.value })}
      />

      <textarea
        placeholder="Description"
        value={task.desc}
        onChange={e => setTask({ ...task, desc: e.target.value })}
      />

      <button onClick={addTask}>Add Task</button>

      <h3>Filter</h3>
      <select onChange={e => setFilter(e.target.value)}>
        <option value="all">All</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
      </select>

      <ul>
        {filteredTasks.map(t => (
          <li key={t.id}>
            <strong>{t.name}</strong> ({t.due})
            <button onClick={() => toggleCompletion(t.id)}>
              {t.completed ? "Pending" : "Completed"}
            </button>
          </li>
        ))}
      </ul>
    </div>
  );
};



                

const App = () => {
  return (
    <div>
      <Reminder />
    </div>
  );
};


                
                console.log('✓ Components defined');
                console.log('Rendering to DOM...');
                
                const rootElement = document.getElementById('root');
                if (!rootElement) {
                    throw new Error('Root element not found');
                }
                
                try {
                    // Try React 18 API first
                    const root = ReactDOM.createRoot(rootElement);
                    root.render(React.createElement(App));
                } catch (e) {
                    // Fallback to React 16/17 API
                    console.log('Using legacy render method...');
                    ReactDOM.render(React.createElement(App), rootElement);
                }
                
                console.log('✓ App rendered successfully');
            } catch (error) {
                console.error('DEMO ERROR:', error);
                const root = document.getElementById('root');
                if (root) {
                    root.innerHTML = '<div style="color: red; padding: 30px; font-family: monospace; font-size: 14px; line-height: 1.5;"><h2>Error:</h2><pre>' + (error.stack || error.message) + '</pre></div>';
                }
            }
        }, 500); // Give React 500ms to load
    </script>
</body>
</html>
